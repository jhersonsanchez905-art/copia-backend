# ============================================================
# Módulo BI — MAJESA
# Configuración de Ruff exclusiva para app/bi/
# Estándares: PEP 257 (docstrings), complejidad, estilo limpio
# ============================================================

[lint]
select = [
    "E",    # pycodestyle errores
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "D",    # pydocstyle (PEP 257)
    "C90",  # complejidad ciclomática
    "N",    # naming conventions
    "UP",   # pyupgrade
    "B",    # bugbear
    "S",    # seguridad
]
ignore = [
    "D100",  # docstring en módulo público (opcional)
    "D104",  # docstring en paquete público (opcional)
    "S101",  # uso de assert (permitido en tests)
    "B008",  # Depends() en argumentos — patrón válido en FastAPI
]

[lint.pydocstyle]
convention = "google"

[lint.mccabe]
max-complexity = 10

[lint.isort]
known-first-party = ["app"]

[format]
quote-style = "double"
indent-style = "space"