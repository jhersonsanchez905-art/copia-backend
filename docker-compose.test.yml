version: "3.9"

services:
  test:
    build: .
    environment:
      DATABASE_URL: ${DATABASE_URL}
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY}
      RESEND_API_KEY: ${RESEND_API_KEY:-not-configured}
      CLOUDINARY_URL: ${CLOUDINARY_URL:-not-configured}
      CRON_SECRET: ${CRON_SECRET:-not-configured}
      GOOGLE_SHEETS_ID: ${GOOGLE_SHEETS_ID:-not-configured}
    command: sh -c "ruff check . && pytest tests/ -v --tb=short"
